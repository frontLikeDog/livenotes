<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A0C0F">
<title>笔记库 · LiveNotes</title>
<script>
/* 主题参数先落到 <html> 上，避免样式加载后再闪一下。 */
try{var _t=new URLSearchParams(location.search).get('theme');if(_t)document.documentElement.dataset.theme=(_t==='paper'?'light':'dark')}catch(e){}
</script>
<script src="/static/js/theme.js"></script>
<link rel="stylesheet" href="/static/css/p1.css">
</head>
<body>
<script src="/static/js/embed.js"></script>

<header class="topbar" data-ln-region="topbar">
  <a class="brand" href="/">
    <span class="brand-mark" aria-hidden="true">L</span>
    <span class="brand-name">LiveNotes<span>实时语记</span></span>
  </a>
  <span class="topbar-divider" aria-hidden="true"></span>
  <nav class="pagenav" aria-label="页面">
    <a href="/library" class="is-on" aria-current="page">笔记库</a>
    <a href="/follows">关注</a>
    <a href="/weekly">周报</a>
    <a href="/tools">内容助手</a>
  </nav>
  <span class="grow"></span>
  <button class="top-search" type="button" data-p1-search aria-label="搜索笔记或提问">
    <svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" aria-hidden="true" style="--od-icon-size:14px">
      <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>
    </svg>
    <span>搜索笔记</span><kbd>Ctrl K</kbd>
  </button>
  <a class="icon-btn" href="/" title="返回首页" aria-label="返回首页">
    <svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="--od-icon-size:16px">
      <path d="m4 10.5 8-6.5 8 6.5V20H4Z"/><path d="M9.5 20v-5.5h5V20"/>
    </svg>
  </a>
</header>

<main class="stage" data-ln-region="stage">
  <div class="page page-wide">
    <header class="page-head">
      <div class="page-head-main">
        <p class="eyebrow">LIBRARY</p>
        <h1>笔记库</h1>
        <p class="page-lead">每一场直播都会变成一篇能读的笔记。点开先看要点，需要时再回到原话。</p>
      </div>
      <div class="page-actions">
        <a class="btn btn-primary" href="/">记录新的一场</a>
      </div>
    </header>

    <div class="list-toolbar">
      <div class="chip-row" id="libFilters" role="group" aria-label="筛选笔记">
        <button class="chip is-on" type="button" data-lib-filter="all">全部</button>
        <button class="chip" type="button" data-lib-filter="week">本周</button>
        <button class="chip" type="button" data-lib-filter="ready">已生成</button>
        <button class="chip" type="button" data-lib-filter="running">生成中</button>
      </div>
      <label class="lib-search-ctrl">
        <input type="search" id="libSearch" name="q" placeholder="搜索关键词" aria-label="搜索笔记关键词"
          autocomplete="off" spellcheck="false">
      </label>
      <label class="sort-ctrl">
        <span>排序</span>
        <select id="libSort" aria-label="笔记排序">
          <option value="time" selected>最近记录</option>
          <option value="duration">时长</option>
          <option value="generated">生成时间</option>
        </select>
      </label>
      <span class="count filter-status" id="libCount" aria-live="polite" aria-atomic="true">共 0 条</span>
    </div>

    <div class="library-grid" id="libGrid" aria-live="polite"></div>

    <div class="page-empty" id="libEmpty" hidden>
      <span class="empty-kicker" id="libEmptyKicker">还没有笔记</span>
      <h2 id="libEmptyTitle">记录第一场直播，这里就会出现一篇笔记。</h2>
      <p id="libEmptyText">音频和逐字稿只保存在本机；记录结束后会自动整理出要点、高光与说话人。</p>
      <a class="btn btn-primary" href="/">开始记录</a>
    </div>

    <div class="library-more" id="libMoreWrap" hidden>
      <button class="btn btn-ghost" type="button" id="libMore">加载更早的笔记</button>
    </div>

    <p class="page-footnote">笔记在记录结束后自动生成，音频与逐字稿只保存在本机。删除或清理旧录音请到文件中心。</p>
  </div>
</main>

<script src="/static/js/p1.js"></script>
<script>
(function () {
  'use strict';
  var S = { filter: 'all', sort: 'time', q: '', cursor: '', items: [], counts: {},
    total: 0, busy: false, seq: 0 };

  function card(item, featured) {
    var meta = P1.noteState(item.note_state, item.progress);
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'note-card' + (featured ? ' is-featured' : '');
    button.setAttribute('aria-label', '打开笔记：' + (item.title || '未命名直播'));

    var top = document.createElement('span');
    top.className = 'note-top';
    var status = document.createElement('span');
    status.className = 'note-status ' + meta.cls;
    status.innerHTML = '<i></i>';
    status.appendChild(document.createTextNode(meta.label));
    var date = document.createElement('span');
    date.className = 'note-date';
    date.appendChild(document.createTextNode(P1.fmtStamp(item.started_at)));
    if ((item.topics || []).length) {
      var tag = document.createElement('span');
      tag.className = 'lib-tag';
      tag.textContent = item.topics[0];
      date.appendChild(tag);
    }
    top.appendChild(status);
    top.appendChild(date);

    var title = document.createElement('span');
    title.className = 'note-title';
    title.textContent = item.title || '未命名直播';

    var summary = document.createElement('span');
    summary.className = 'note-summary';
    summary.textContent = item.summary || meta.label + ' · 可以先看逐字稿';

    var counts = document.createElement('span');
    counts.className = 'note-counts';
    if (item.note_state === 'failed') {
      counts.textContent = '逐字稿已保留 · 可打开重试';
    } else if (item.note_state === 'running' || item.note_state === 'queued') {
      counts.textContent = '已有 ' + (item.progress || 0) + '% · 可以先看逐字稿';
    } else if (item.note_state === 'ready' || item.note_state === 'partial') {
      counts.textContent = item.n_points + ' 个要点 · ' + item.n_highlights + ' 段高光 · '
        + item.speaker_count + ' 位说话人'
        + (item.n_bookmarks ? ' · ' + item.n_bookmarks + ' 个书签' : '');
    } else {
      counts.textContent = (item.n_utterances || 0) + ' 条发言 · 还没有要点';
    }

    var foot = document.createElement('span');
    foot.className = 'note-foot';
    var avatar = document.createElement('span');
    var name = item.streamer || '本机记录';
    avatar.className = 'mini-avatar ' + P1.tone(name);
    avatar.setAttribute('aria-hidden', 'true');
    avatar.textContent = P1.initial(name);
    var footText = document.createElement('span');
    footText.className = 'note-foot-text';
    footText.textContent = name + ' · ' + P1.durText(item.duration_s);
    foot.appendChild(avatar);
    foot.appendChild(footText);

    button.appendChild(top);
    button.appendChild(title);
    button.appendChild(summary);
    button.appendChild(counts);
    button.appendChild(foot);
    button.addEventListener('click', function () {
      P1.metric('card_click', { session_id: item.session_id, kind: item.note_state });
      P1.goNote(item.session_id, null);
    });
    return button;
  }

  function render(reset, added) {
    var grid = P1.$('#libGrid');
    if (reset) grid.innerHTML = '';
    (added || S.items).forEach(function (item, index) {
      // 搜索/筛选态下不放大第一张卡片；仅「全部」无关键词时保留首图。
      grid.appendChild(card(item, reset && index === 0 && S.filter === 'all' && !S.q));
    });
    P1.$('#libMoreWrap').hidden = !S.cursor;
    P1.$('#libEmpty').hidden = S.items.length > 0 || S.busy;
    // 当前筛选（含关键词）后的结果总数；翻页不改变，0 条也明确显示。
    var total = S.total || 0;
    P1.$('#libCount').textContent = '共 ' + total + ' 条';
    // 空状态保留：库里本来就没有笔记 vs. 筛选/关键词没有匹配，两种提示分开。
    var libTotal = S.counts.all || 0;
    if (!S.items.length && !S.busy && libTotal > 0) {
      P1.$('#libEmptyKicker').textContent = '没有筛选结果';
      P1.$('#libEmptyTitle').textContent = '没有符合当前筛选的笔记。';
      P1.$('#libEmptyText').textContent = '换一个筛选或关键词，或查看全部笔记。';
    } else if (!S.items.length && !S.busy && libTotal === 0) {
      P1.$('#libEmptyKicker').textContent = '还没有笔记';
      P1.$('#libEmptyTitle').textContent = '记录第一场直播，这里就会出现一篇笔记。';
      P1.$('#libEmptyText').textContent =
        '音频和逐字稿只保存在本机；记录结束后会自动整理出要点、高光与说话人。';
    }
  }

  function load(reset) {
    // 翻页需要上一页的加载完成；重置类请求（筛选/关键词/排序）立即发出，
    // 用 seq 丢弃过期响应，保证数量与列表最终一致。
    if (!reset && S.busy) return;
    S.busy = true;
    if (reset) { S.cursor = ''; S.items = []; }
    var mySeq = ++S.seq;
    P1.$('#libMore').disabled = true;
    var size = (P1.perf && P1.perf.effective && P1.perf.effective.library_page) || 24;
    var url = '/api/library/cards?limit=' + size + '&filter=' + encodeURIComponent(S.filter)
      + '&sort=' + encodeURIComponent(S.sort)
      + (S.q ? '&q=' + encodeURIComponent(S.q) : '')
      + (S.cursor ? '&cursor=' + encodeURIComponent(S.cursor) : '');
    P1.api(url).then(function (d) {
      if (mySeq !== S.seq) return; // 已有更新的请求，旧响应作废
      S.busy = false;
      P1.$('#libMore').disabled = false;
      if (d.error) {
        P1.toast(d.error);
        // 与 .catch 一致：清理数量、网格与翻页状态，不留旧卡片与旧数量。
        S.total = 0;
        render(true, []);
        return;
      }
      var added = d.items || [];
      S.items = reset ? added : S.items.concat(added);
      S.cursor = d.next_cursor || '';
      S.counts = d.counts || S.counts;
      if (typeof d.total === 'number') S.total = d.total;
      render(reset, added);
      if (reset) P1.metric('library_open', { kind: S.filter });
    }).catch(function () {
      if (mySeq !== S.seq) return;
      S.busy = false;
      P1.$('#libMore').disabled = false;
      P1.toast('笔记库没有加载出来，稍后再试。');
      S.total = 0;
      render(true, []);
    });
  }

  P1.$('#libFilters').addEventListener('click', function (e) {
    var button = e.target.closest('[data-lib-filter]');
    if (!button) return;
    S.filter = button.getAttribute('data-lib-filter');
    P1.$$('#libFilters .chip').forEach(function (chip) {
      chip.classList.toggle('is-on', chip === button);
    });
    load(true);
  });
  P1.$('#libSort').addEventListener('change', function (e) {
    S.sort = e.target.value;
    load(true);
  });
  // 输入/清空关键词：重新过滤列表并更新当前结果数量。
  P1.$('#libSearch').addEventListener('input', P1.debounce(function (e) {
    if (e.isComposing) return; // 输入法组字中不请求，等组词结束的 input 再过滤
    S.q = (e.target.value || '').trim();
    load(true);
  }, 250));
  P1.$('#libMore').addEventListener('click', function () { load(false); });

  P1.$('#libGrid').innerHTML = '<div class="skeleton-card"></div>'
    + '<div class="skeleton-card"></div><div class="skeleton-card"></div>';
  (P1.perfReady || Promise.resolve()).then(function () { load(true); });
})();
</script>
</body>
</html>
